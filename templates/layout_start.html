<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DataForge AI</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0f172a;
            color:white;
            font-family:Segoe UI,sans-serif;
        }

        .layout{
            display:flex;
            min-height:100vh;
        }

        .sidebar{
            width:260px;
            background:#111827;
            padding:25px;
            border-right:1px solid #1e293b;
        }

        .logo{
            color:#38bdf8;
            font-size:28px;
            font-weight:bold;
            margin-bottom:40px;
        }

        .nav-link{
            display:block;
            text-decoration:none;
            color:white;
            background:#1e293b;
            padding:14px;
            border-radius:10px;
            margin-bottom:10px;
            transition:0.3s;
        }

        .nav-link:hover{
            background:#2563eb;
        }

        .content{
            flex:1;
            padding:30px;
        }

        .card{
            background:#1e293b;
            padding:25px;
            border-radius:15px;
            margin-bottom:20px;
        }

        h1{
            color:#38bdf8;
            margin-bottom:10px;
        }

        h2{
            color:#60a5fa;
            margin-bottom:15px;
        }

        p{
            color:#cbd5e1;
        }

        .button{
            display:inline-block;
            background:#2563eb;
            color:white;
            text-decoration:none;
            padding:12px 20px;
            border-radius:8px;
        }

        .button:hover{
            background:#1d4ed8;
        }

        .metrics{
            display:grid;
            grid-template-columns:
            repeat(auto-fit,minmax(220px,1fr));
            gap:15px;
        }

        .metric{
            background:#0f172a;
            padding:20px;
            border-radius:10px;
            border:1px solid #334155;
        }

        .metric-title{
            color:#94a3b8;
            font-size:14px;
        }

        .metric-value{
            font-size:32px;
            font-weight:bold;
            margin-top:10px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#0f172a;
        }

        td,
        th{
            border:1px solid #334155;
            padding:10px;
        }

        tr:nth-child(even){
            background:#243447;
        }

    </style>

</head>

<body>

<div class="layout">

    <div class="sidebar">

        <div class="logo">
            🚀 DataForge AI
        </div>

        <a href="/" class="nav-link">
            Dashboard
        </a>

        <a href="/upload" class="nav-link">
            Upload Dataset
        </a>

        <a href="/datasets" class="nav-link">
            Dataset Catalog
        </a>

        <a href="/analytics" class="nav-link">
            Analytics
        </a>

        <a href="/ai" class="nav-link">
            AI Analyst
        </a>

        <a href="/settings" class="nav-link">
            Settings
        </a>

    </div>

    <div class="content">
